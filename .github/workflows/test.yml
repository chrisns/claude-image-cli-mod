name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python helper (${{ matrix.os }}, ${{ matrix.decoder }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        decoder: [pillow, imagemagick]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        if: matrix.decoder == 'pillow'
        run: python -m pip install Pillow
      - name: Install ImageMagick
        if: matrix.decoder == 'imagemagick'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install imagemagick; else sudo apt-get update && sudo apt-get install -y imagemagick; fi
      - name: Test
        run: python -m unittest discover -s mod/tests -p 'test_*.py' -v

  mod:
    name: Mod (validate and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Validate
        run: claude plugin validate .
      - name: Test
        run: claude plugin test mod
